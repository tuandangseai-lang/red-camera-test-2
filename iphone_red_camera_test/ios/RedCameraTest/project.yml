name: RedCameraTest
options:
  bundleIdPrefix: vn.rockettracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "9.17"
    CURRENT_PROJECT_VERSION: "96"
targets:
  RedCameraTest:
    type: application
    platform: iOS
    sources:
      - path: RedCameraTest/RedCameraTestApp.swift
      - path: RedCameraTest/ContentView.swift
      - path: RedCameraTest/H2DBLEManager.swift
      - path: RedCameraTest/H2DTimelapseManager.swift
      - path: RedCameraTest/H2DTimelapseView.swift
      - path: RedCameraTest/BambuPrinterProfile.swift
      - path: RedCameraTest/BambuCredentialStore.swift
      - path: RedCameraTest/Assets.xcassets
    info:
      path: RedCameraTest/Info.plist
      properties:
        CFBundleDisplayName: SE
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSBluetoothAlwaysUsageDescription: Kết nối ESP32 để nhận tín hiệu từng lớp từ máy in H2D.
        NSCameraUsageDescription: Chụp từng lớp để tạo timelapse H2D.
        NSPhotoLibraryAddUsageDescription: Lưu video timelapse H2D vào ứng dụng Ảnh.
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.rockettracker.RedCameraTest
        MARKETING_VERSION: "9.17"
        CURRENT_PROJECT_VERSION: "96"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
