name: RedCameraTest
options:
  bundleIdPrefix: vn.rockettracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RedCameraTest:
    type: application
    platform: iOS
    sources:
      - path: RedCameraTest
    info:
      path: RedCameraTest/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.rockettracker.RedCameraTest
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
