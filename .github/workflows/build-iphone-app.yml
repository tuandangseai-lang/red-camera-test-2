name: Tao IPA SE v9.0 build78 - H2D timelapse co dinh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iphone_red_camera_test/**"
      - ".github/workflows/build-iphone-app.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build SE iPhone App
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Tao project Xcode
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          test -f "RedCameraTest/H2DBLEManager.swift"
          xcodegen generate

      - name: Kiem tra kien truc H2D co dinh
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          PLIST="RedCameraTest/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          test -f "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "RedCameraTest/H2DBLEManager.swift"
          test -f "RedCameraTest/H2DTimelapseManager.swift"
          test -f "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case "SNAP"' "RedCameraTest/H2DBLEManager.swift"
          grep -q "AVAssetWriter" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isIdleTimerDisabled" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "H2DTimelapseView" "RedCameraTest/ContentView.swift"
          ! grep -q "CameraController.swift" project.yml
          ! grep -q "path: RedCameraTest/BLEManager.swift" project.yml
          ! grep -q "VoiceNotifier.swift" project.yml
          ! grep -q "NSMicrophoneUsageDescription" "$PLIST"

      - name: Bien dich app iPhone chua ky
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project RedCameraTest.xcodeproj \
            -scheme RedCameraTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "## Loi bien dich Swift/Xcode" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(fatal )?error:|:[0-9]+:[0-9]+: error:' "$BUILD_LOG" \
              | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Dong goi IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RedCameraTest.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "SE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "9.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "78"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/SE-v9.0-build78-unsigned.ipa"

      - name: Tai IPA
        uses: actions/upload-artifact@v7
        with:
          name: SE-v9.0-build78-unsigned-ipa
          path: SE-v9.0-build78-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-h2d-esp32:
    name: Build ESP32 H2D Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cai ESP32 va thu vien MQTT
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install PubSubClient

      - name: Bien dich firmware cau noi H2D
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SE-H2D-ESP32"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir "$RUNNER_TEMP/SE-H2D-ESP32" \
            iphone_red_camera_test/esp32_h2d_timelapse_ble

      - name: Tai firmware ESP32
        uses: actions/upload-artifact@v7
        with:
          name: SE-H2D-ESP32-v1.0.1
          path: ${{ runner.temp }}/SE-H2D-ESP32/*
          if-no-files-found: error
          retention-days: 7
