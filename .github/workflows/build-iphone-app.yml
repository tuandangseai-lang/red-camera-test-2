          grep -q "Đầu phải" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Đầu trái" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "left is outside, right is inside" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Quạt chi tiết" "RedCameraTest/H2DTimelapseView.swift"
          grep -q '"Part fan"' "RedCameraTest/SELanguage.swift"
          ! grep -q "setupCameraEnabled" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "synchronizePrinterAlarm" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "camera sẵn sàng cho lần chụp kế tiếp" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "gain.globalGain = 9.54" "RedCameraTest/PrinterAlarmPlayer.swift"
          grep -q "criticalAlarmMinimumVolume: Float = 0.75" "RedCameraTest/PrinterAlarmPlayer.swift"
          grep -q "player.isPlaying && engine.isRunning" "RedCameraTest/PrinterAlarmPlayer.swift"
          ! grep -q "scheduleCameraSleep" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "restoreDisplayWhenLeaving" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "setViewActive" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "scheduleHardwareControls" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "if changed" "RedCameraTest/H2DBLEManager.swift"
          ! grep -q "đang đồng bộ loại nhựa\|đang đồng bộ nhựa" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'hasPrefix("22E")' "RedCameraTest/BambuPrinterProfile.swift"
          grep -q "hasActivePrinterAlert" "RedCameraTest/H2DBLEManager.swift"
          grep -q "hasActiveCriticalPrinterAlert" "RedCameraTest/H2DBLEManager.swift"
          grep -q "attemptAutomaticConfigurationIfNeeded" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "lanAccessCode.recovery" "RedCameraTest/BambuCredentialStore.swift"
          grep -q "ScreenEdgeLEDStrip" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case completed' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "requestFleetRefresh" "RedCameraTest/H2DBLEManager.swift"
          grep -q "setHardwareBuzzerEnabled" "RedCameraTest/H2DBLEManager.swift"
          ! grep -q "hardwareLevelPercent" "RedCameraTest/H2DBLEManager.swift" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "breathingPeriod" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "preservesProgressWhenHidden" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "ClockwiseScreenBorderShape" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "setCaptureScreenBrightness" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q 'SE.AppLanguage' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'frame(width: 180, height: 320)' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case "FAILED": return .stopping' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'Hiện hình xem trước' "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "activePrinterCameraMonitor" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "OPTICAL VIEWFINDER" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "allowSetupPreview: false" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "silenceCurrentPrinterAlarm" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'Tắt cảnh báo' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "desiredTimelapseArmed" "RedCameraTest/H2DBLEManager.swift"
          grep -q "printerSwitchProgress" "RedCameraTest/H2DBLEManager.swift"
          grep -q "printerProfileSwitchProgress" "RedCameraTest/H2DTimelapseView.swift"
          sips -g hasAlpha "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" | grep -q "hasAlpha: no"
          grep -q "cameraWarmupTimeout" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q 'video.slash.fill' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Hồ sơ.*đã lưu" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "H2DTimelapseView" "RedCameraTest/ContentView.swift"
          ! grep -q "CameraController.swift" project.yml
          ! grep -q "path: RedCameraTest/BLEManager.swift" project.yml
          ! grep -q "VoiceNotifier.swift" project.yml
          ! grep -q "VLCKit" project.yml
          grep -q "BambuPrinterCamera.swift" project.yml
          grep -q "BambuPrinterCameraManager" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "RTP/AVP/TCP;unicast;interleaved=0-1" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "CMVideoFormatDescriptionCreateFromH264ParameterSets" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "0x3000" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "printerCameraCard" "RedCameraTest/H2DTimelapseView.swift"
          test "$(grep -c 'PrinterRemoteControlView(' "RedCameraTest/H2DTimelapseView.swift")" -eq 1
          ! grep -q "printerRemoteControlCard\|showPrinterControls" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "skipSelectedPrintObjects" "RedCameraTest/H2DBLEManager.swift"
          grep -q "loadFilament" "RedCameraTest/H2DBLEManager.swift"
          grep -q 'iconOnlyActionLabel("Dừng", icon: "stop.fill")' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "alarmNeedsAttention" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "Tắt cảnh báo" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "liveNozzleTemperatureText" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'usesLeftNozzlePath ? "Rút đầu trái" : "Rút nhựa"' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "PrinterSpeedDial" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "LongPressGesture(minimumDuration: 0.55" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "lifetimePrintHours" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "lifetimeHoursStorageKey" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q "elapsedPrintHoursText(at: context.date)" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "ams_filament_drying" "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'BambuAMSDryingProtocol.fields' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"duration": enabled ? durationHours : 0' "RedCameraTest/BambuAMSProtocol.swift"
          ! grep -q 'durationHours \* 60' "RedCameraTest/BambuPrinterControl.swift" "RedCameraTest/BambuAMSProtocol.swift"
          grep -q "amsHumidityPercentByUnit" "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"drop.fill" : "drop"' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'Text(localized("Tốc độ in %"))' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'font(.system(size: 20, weight: .bold, design: .rounded))' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'se.ams.humidity-drying' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'disabled(!printActionsAvailable)' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "selectedExternalExtruderID" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "DashboardTemperatureEditorSheet" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'speedPercents = \[50, 100, 124, 166\]' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'Đã đùn nhựa • Tiếp tục' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'Đã rút xong • Tiếp tục' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "activePrompt" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'command: "ams_control"' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'fields\["err"\] = String(code)' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'command: "ignore"' "RedCameraTest/BambuPrinterControl.swift"
          grep -q "lights_report" "RedCameraTest/BambuPrinterControl.swift"
          grep -q "LivePrintProgressRing" "RedCameraTest/H2DTimelapseView.swift"
          grep -Fq 'Text("/\(target)°C")' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Gradient(stops:" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "printerCameraHelpText\|LAN Only Liveview (Local RTSP Stream)" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "updateDryerPulse" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "saturation(selected ? 1 : 0.34)" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "next.filamentPresentByExtruder\[externalID\] = true" "RedCameraTest/BambuPrinterControl.swift"
          ! grep -q "pickerStyle(.segmented)" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q 'Button(localized("Bật đèn"))\|Button(localized("Tắt đèn"))' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q 'languageCode: appLanguageCode' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'Preparing direct controls' "RedCameraTest/SELanguage.swift"
          ! grep -q "CAMERA MÁY IN\|CHẠM VẬT THỂ CẦN BỎ QUA" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q "objectIDsText\|filamentSource\|selectedObjectIDs" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "BambuPrinterControl.swift" project.yml
          ! grep -q "ZIPFoundation" project.yml
          ! grep -q 'command: "skip_objects"' "RedCameraTest/BambuPrinterControl.swift"
