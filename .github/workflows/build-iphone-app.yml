name: Tao IPA Rocket Tracker v14 - smooth servo telemetry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iphone_red_camera_test/**"
      - ".github/workflows/build-iphone-app.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build Rocket Tracker
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Chuan bi Python cho model AI
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Xuat model da huan luyen sang Core ML
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          # Core ML Tools still relies on NumPy 1.x scalar conversion in a few
          # MIL ops.  Pin it before importing Ultralytics instead of allowing
          # the exporter to change NumPy mid-process and require a restart.
          python -m pip install --quiet "numpy==1.26.4" "ultralytics==8.4.117" "coremltools>=8.0,<10"
          python - <<'PY'
          from pathlib import Path
          import shutil
          from ultralytics import YOLO

          root = Path.cwd()
          weights = root / "iphone_red_camera_test" / "ai_training" / "weights" / "water_rocket_yolo11n_v3.pt"
          target = root / "iphone_red_camera_test" / "ios" / "RedCameraTest" / "RedCameraTest" / "WaterRocketDetector.mlpackage"
          bottle_target = root / "iphone_red_camera_test" / "ios" / "RedCameraTest" / "RedCameraTest" / "BottleDetector.mlpackage"
          if not weights.is_file():
              raise SystemExit(f"Missing trained weights: {weights}")
          exported = Path(YOLO(str(weights)).export(format="coreml", imgsz=640, nms=True))
          if target.exists():
              shutil.rmtree(target)
          shutil.move(str(exported), str(target))
          print(f"Core ML package: {target}")

          # Detector COCO tổng quát giữ kiến thức về nhiều kiểu chai: chai trơn,
          # chai trong suốt, chai không có mũi/cánh. 5 ảnh cá nhân trong app vẫn
          # là cổng xác nhận cuối, nên model này không tự khóa nhầm chai khác.
          bottle_export = Path(YOLO("yolo11n.pt").export(format="coreml", imgsz=640, nms=True))
          if bottle_target.exists():
              shutil.rmtree(bottle_target)
          shutil.move(str(bottle_export), str(bottle_target))
          print(f"Bottle Core ML package: {bottle_target}")
          PY
          test -d "iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/WaterRocketDetector.mlpackage"
          test -d "iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/BottleDetector.mlpackage"

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Tao project Xcode
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          test -f "RedCameraTest/VoiceNotifier.swift"
          xcodegen generate

      - name: Kiem tra quyen, icon va giong bao
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          PLIST="RedCameraTest/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          test -f "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "RedCameraTest/Assets.xcassets/WaterRocketTabIcon.imageset/WaterRocketTabIcon@3x.png"
          grep -q 'Image("WaterRocketTabIcon")' "RedCameraTest/ContentView.swift"
          grep -q "trackingPreparationCountdownOverlay" "RedCameraTest/ContentView.swift"
          grep -q "referenceVideoTimerOverlay" "RedCameraTest/ContentView.swift"
          grep -q "speaker.wave.2.fill" "RedCameraTest/ContentView.swift"
          grep -q "if #available(iOS 18.0, \*)" "RedCameraTest/CameraController.swift"
          grep -q "scanProgressRing" "RedCameraTest/ContentView.swift"
          grep -q "scanSampleTarget" "RedCameraTest/CameraController.swift"
          grep -q "maximumSmoothDisplayZoom: CGFloat = 0.98" "RedCameraTest/CameraController.swift"
          grep -q "fastRecordingFormat" "RedCameraTest/CameraController.swift"
          grep -q "efficientPreviewFormat" "RedCameraTest/CameraController.swift"
          grep -q "suspendForBackground" "RedCameraTest/CameraController.swift"
          grep -q "WaterRocketDetector" "RedCameraTest/RocketAIDetector.swift"
          grep -q "BottleDetector" "RedCameraTest/CameraController.swift"
          grep -q "final class RocketAIDetector" "RedCameraTest/RocketAIDetector.swift"
          grep -q "RocketMotionFilter" "RedCameraTest/RocketMotionFilter.swift"
          grep -q "verifyWithAIDetector" "RedCameraTest/CameraController.swift"
          grep -q "aiAcquisitionConfidence = 0.42" "RedCameraTest/CameraController.swift"
          test -d "RedCameraTest/WaterRocketDetector.mlpackage"
          test -d "RedCameraTest/BottleDetector.mlpackage"
          grep -q "VNGenerateForegroundInstanceMaskRequest" "RedCameraTest/CameraController.swift"
          grep -q "connectedCrystalCells" "RedCameraTest/CameraController.swift"
          grep -q "crystalMesh" "RedCameraTest/ContentView.swift"
          grep -q "startShapeScan" "RedCameraTest/ContentView.swift"
          if grep -q "scanFinishWorkItem" "RedCameraTest/CameraController.swift"; then
            echo "Van con gioi han thoi gian quet"
            exit 1
          fi

      - name: Bien dich app iPhone (chua ky)
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project RedCameraTest.xcodeproj \
            -scheme RedCameraTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "## Loi bien dich Swift/Xcode" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(fatal )?error:|:[0-9]+:[0-9]+: error:' "$BUILD_LOG" \
              | tail -80 \
              | tee -a "$GITHUB_STEP_SUMMARY" \
              | while IFS= read -r line; do
                  line=${line//'%'/'%25'}
                  line=${line//$'\r'/'%0D'}
                  line=${line//$'\n'/'%0A'}
                  echo "::error title=Xcode build::$line"
                done
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Dong goi thanh IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RedCameraTest.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -d "$APP_PATH/WaterRocketDetector.mlmodelc"
          test -d "$APP_PATH/BottleDetector.mlmodelc"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 4.2" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion 38" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "4.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "38"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/RocketTracker-unsigned.ipa"

      - name: Cho phep tai IPA ve Windows
        uses: actions/upload-artifact@v7
        with:
          name: RocketTracker-unsigned-ipa
          path: RocketTracker-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
