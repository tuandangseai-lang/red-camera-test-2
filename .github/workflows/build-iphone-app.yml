          grep -q 'static let leftVirtualTrayID = 254' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'BambuExternalSpoolRoute.virtualTrayID' "RedCameraTest/BambuPrinterControl.swift"
          ! grep -q 'extruderID == 1 ? 253 : 254' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"ams_id": virtualAMSID' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"extruder_id": extruderID' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'command: "set_nozzle_temp"' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"param": "M104 S' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'private func printerDashboardSummary' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'frame(width: 230 \* scale, height: 230 \* scale)' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "blinks: false" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "idlePulse" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "ESP32-C3" "RedCameraTest/H2DTimelapseView.swift"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$PLIST"
          ! grep -q "NSMicrophoneUsageDescription" "$PLIST"

      - name: Bien dich app iPhone chua ky
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project RedCameraTest.xcodeproj \
            -scheme RedCameraTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "## Loi bien dich Swift/Xcode" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(fatal )?error:|:[0-9]+:[0-9]+: error:' "$BUILD_LOG" \
              | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Dong goi IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RedCameraTest.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/fire-alarm-sound.mp3"
          test -f "$APP_PATH/iphone-screenshot-shutter.mp3"
          test -f "$APP_PATH/cine-projector-loop.mp3"
          test -f "$APP_PATH/en.lproj/Localizable.strings"
          test -f "$APP_PATH/vi.lproj/Localizable.strings"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "SE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "9.101"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "180"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/SE-v9.101-build180-unsigned.ipa"

      - name: Tai IPA
        uses: actions/upload-artifact@v7
        with:
          name: SE-v9.101-build180-unsigned-ipa
          path: SE-v9.101-build180-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Kiem tra va chup giao dien iPhone Simulator
        if: ${{ inputs.skip_interface_checks != true }}
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/interface-check"
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          phones = [d for group in json.load(sys.stdin)["devices"].values() for d in group if "iPhone" in d["name"]]
          for choices in [("iPhone SE (3rd generation)", "iPhone 16e", "iPhone 17"), ("iPhone 17 Pro Max", "iPhone 16 Pro Max", "iPhone 17 Pro")]:
              device = next((d for name in choices for d in phones if d["name"] == name), phones[0])
              print(device["udid"])
          ' > "$RUNNER_TEMP/interface-devices.txt"
          index=0
          while IFS= read -r device; do
            index=$((index + 1))
            xcodebuild test -project RedCameraTest.xcodeproj -scheme RedCameraTest \
              -configuration Debug -destination "platform=iOS Simulator,id=$device" \
              -derivedDataPath "$RUNNER_TEMP/SimulatorBuild" \
              -resultBundlePath "$RUNNER_TEMP/interface-check/phone-$index.xcresult" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              -parallel-testing-enabled NO \
              > "$RUNNER_TEMP/interface-check/phone-$index.log" 2>&1 && status=0 || status=$?
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/interface-check/phone-$index.xcresult" \
              --output-path "$RUNNER_TEMP/interface-check/phone-$index-images"
            if [ "$status" -ne 0 ]; then
              tail -100 "$RUNNER_TEMP/interface-check/phone-$index.log"
              exit "$status"
            fi
          done < "$RUNNER_TEMP/interface-devices.txt"

      - name: Tai ket qua kiem tra giao dien
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SE-v9.101-build180-interface-check
          path: ${{ runner.temp }}/interface-check/
          if-no-files-found: warn
          retention-days: 7

  build-h2d-esp32:
    if: ${{ inputs.app_only != true }}
    name: Build ESP32 Bambu Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Kiem tra mau LED va uu tien canh bao
        run: python3 iphone_red_camera_test/tests/LedPolicyRegression/check.py

      - name: Cai Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cai ESP32, MQTT, NimBLE va NeoPixel
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install PubSubClient@2.8
          arduino-cli lib install NimBLE-Arduino@2.5.1
          arduino-cli lib install "Adafruit NeoPixel@1.15.5"

      - name: Tranh double-free khi TLS mat ket noi
        run: |
          set -euo pipefail
          PUBSUB_CPP="$(find "$HOME" -path '*/PubSubClient/src/PubSubClient.cpp' -print -quit)"
          test -n "$PUBSUB_CPP"
          python3 - "$PUBSUB_CPP" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "            if (this->_state == MQTT_CONNECTED) {\n                this->_state = MQTT_CONNECTION_LOST;\n                _client->flush();\n                _client->stop();\n            }"
          new = "            if (this->_state == MQTT_CONNECTED) {\n                this->_state = MQTT_CONNECTION_LOST;\n#if !defined(ARDUINO_ARCH_ESP32)\n                _client->flush();\n                _client->stop();\n#endif\n            }"
          if old not in text:
              raise SystemExit("PubSubClient connected() block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          NETWORK_SECURE_CPP="$(find "$HOME" -path '*/NetworkClientSecure/src/NetworkClientSecure.cpp' -print -quit)"
          test -n "$NETWORK_SECURE_CPP"
          python3 - "$NETWORK_SECURE_CPP" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "uint8_t NetworkClientSecure::connected() {\n  if (_connected) {\n    uint8_t dummy = 0;\n    read(&dummy, 0);\n  }\n  return _connected;\n}"
          new = "uint8_t NetworkClientSecure::connected() {\n  // Avoid the ESP32 TLS read(0) probe; available()/read() owns disconnect cleanup.\n  return _connected;\n}"
          if old not in text:
              raise SystemExit("NetworkClientSecure connected() block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Bien dich firmware cau noi H2D
        run: |
          set -euo pipefail
          grep -q 'id == 0 ? nozzleTemperature : leftNozzleTemperature' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'hasCriticalPrinterError' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_PROFILE' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'maintainFleetMonitors' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_REFRESH_PERIOD_MS = 15000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_MONITOR_DWELL_MS = 3000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_SAMPLES_PER_REFRESH = 1' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_REFRESH_WATCHDOG_MS = 8000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_PROBE_PERIOD_MS = 2500' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'hadReliablePrintBaseline' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'reliableStateStartEdge' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'startBeepIssuedForActiveSession' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'resetsPrintStartBeep' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'requestBuzzerBeep(180)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'requestBuzzerBeep(80)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'v1.28.2' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'VIRTUAL_TRAY_RIGHT_ID = 255' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'VIRTUAL_TRAY_LEFT_ID = 254' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'externalExtruderID == 1 ? 253 : 254' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'BLE_NOTIFY_GAP_MS = 12' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'SEMQTTPayloadStream<Config::MQTT_BUFFER_BYTES>' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'mqtt.setStream(mqttPayload)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'fleetMqtt.setStream(mqttPayload)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'setBufferSize(Config::MQTT_BUFFER_BYTES)\|setBufferSize(22528)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_FLEET_REFRESH' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'BUZZER_PIN = 33' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'updateBuzzerAlarm' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'mc_remaining_time' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'isPausedState' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_STRIP_PIN = 5' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_STATUS_COUNT = 3' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_ANIMATED_COUNT = 4' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_PHYSICAL_COUNT = 10' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_IDLE_MAX_SCALE = 102' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_BUZZER' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_DEFAULT_BRIGHTNESS_PERCENT = 95' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'fixedLedBrightness' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'LEVEL_POT\|potentiometerDetected\|CONTROL,LEVEL' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'modeEntryFlashUntil = now + 1000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'hardwareMode == 0' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'breathingScale(now)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'completedPixels + 1' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FILAMENT_CHANGE_ERROR_GRACE_MS = 6000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'promoteDeferredFilamentErrors' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_PRINTER_COUNT = 3' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'fleetPrimaryPaused' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'maximumProfiles = 3' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/BambuPrinterProfile.swift
          grep -q 'H2D_PROFILE_SLOT' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_BUZZER_VOLUME' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_ALARM_ACK' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_PRINT_STOP' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'skip_objects' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'ams_change_filament' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'Chỉ hỗ trợ cuộn nhựa ngoài' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'const bool amsSlot' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'processRemoteControlQueue' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'publishSelectedPrinterQos1' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'remoteControlAwaitingReport' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'A fault is a fleet-level safety event' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DBLEManager.swift
          ! grep -q 'return criticalKind == printerKind' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DBLEManager.swift
          grep -q 'settingsPreviewUntil' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'Brightness is a global intensity control' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'BUZZER_VOLUME_PWM_HZ = 100' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'BUZZER_VOLUME_PWM_BITS = 10' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'curved = static_cast<uint32_t>(volume) \* volume' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'Hoàn thành lúc' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DBLEManager.swift
          grep -q 'TIẾN ĐỘ IN THỜI GIAN THỰC' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DTimelapseView.swift
          grep -q 'Chế độ timelapse tiết kiệm pin' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DTimelapseManager.swift
          grep -q 'Flash mode should show only the clean lightning artwork' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DTimelapseView.swift
          ! grep -q 'đang đồng bộ nhựa\|đang đồng bộ loại nhựa' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DTimelapseView.swift
          ! grep -q 'safeAreaInset(edge: .top' iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/H2DTimelapseView.swift
