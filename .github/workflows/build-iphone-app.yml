name: Tao IPA SE v9.101 build180 - sua AMS cuon 4 va don vi say

on:
  workflow_dispatch:
    inputs:
      firmware_only:
        description: Build pinned ESP32 handover firmware only
        type: boolean
        default: false
      app_only:
        description: Build app only, reuse the pinned firmware artifact
        type: boolean
        default: false
      skip_interface_checks:
        description: Skip repeated UI tests for documentation-only string cleanup
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "iphone_red_camera_test/**"
      - ".github/workflows/build-iphone-app.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    if: ${{ inputs.firmware_only != true }}
    name: Build SE iPhone App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Kiem tra ngon ngu va cache so voi moc 101
        run: |
          set -euo pipefail
          git show 101:iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/SELanguage.swift |
            sed -e 's/SEStatusCopy/SEBaselineStatusCopy/g' -e 's/SEAppLanguage/SEBaselineAppLanguage/g' > "$RUNNER_TEMP/BaselineLanguage.swift"
          swiftc -O "$RUNNER_TEMP/BaselineLanguage.swift" \
            iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/SELanguage.swift \
            iphone_red_camera_test/tests/LanguageRegression/main.swift \
            -o "$RUNNER_TEMP/language-regression"
          "$RUNNER_TEMP/language-regression"

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Kiem tra lenh va phan hoi MQTT khong ket noi may in
        run: |
          set -euo pipefail
          swiftc -O \
            iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/BambuControlProtocol.swift \
            iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/SELanguage.swift \
            iphone_red_camera_test/tests/BambuControlRegression/main.swift \
            -o "$RUNNER_TEMP/bambu-control-regression"
          "$RUNNER_TEMP/bambu-control-regression"

      - name: Tao project Xcode
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          test -f "RedCameraTest/H2DBLEManager.swift"
          xcodegen generate

      - name: Kiem tra cuon AMS va don vi say khong ket noi may in
        run: |
          set -euo pipefail
          swiftc -O \
            iphone_red_camera_test/ios/RedCameraTest/RedCameraTest/BambuAMSProtocol.swift \
            iphone_red_camera_test/tests/BambuAMSRegression/main.swift \
            -o "$RUNNER_TEMP/bambu-ams-regression"
          "$RUNNER_TEMP/bambu-ams-regression"

      - name: Kiem tra kien truc H2D co dinh
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          PLIST="RedCameraTest/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          test -f "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "RedCameraTest/H2DBLEManager.swift"
          test -f "RedCameraTest/H2DTimelapseManager.swift"
          test -f "RedCameraTest/H2DTimelapseView.swift"
          test -f "RedCameraTest/PrinterRemoteControlView.swift"
          test -f "RedCameraTest/BambuPrinterControl.swift"
          test -f "RedCameraTest/SELanguage.swift"
          test -f "RedCameraTest/en.lproj/Localizable.strings"
          test -f "RedCameraTest/vi.lproj/Localizable.strings"
          test -f "RedCameraTest/BambuPrinterProfile.swift"
          test -f "RedCameraTest/BambuCredentialStore.swift"
          test -f "RedCameraTest/BambuPrinterCamera.swift"
          test -f "RedCameraTest/PrinterAlarmPlayer.swift"
          test -f "RedCameraTest/fire-alarm-sound.mp3"
          test -f "RedCameraTest/iphone-screenshot-shutter.mp3"
          test -f "RedCameraTest/cine-projector-loop.mp3"
          grep -q 'case "SNAP"' "RedCameraTest/H2DBLEManager.swift"
          grep -q 'case "CFG_ACK"' "RedCameraTest/H2DBLEManager.swift"
          grep -q 'case "ALERT"' "RedCameraTest/H2DBLEManager.swift"
          grep -q 'case "FLEET"' "RedCameraTest/H2DBLEManager.swift"
          grep -q "syncFleetProfiles" "RedCameraTest/H2DBLEManager.swift"
          grep -q "requestStopCapture" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "printerDashboardSummary()" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "frame(maxWidth: 430)" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "aspectRatio(2.05" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "scaledToFill()" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "filamentTargetStepper" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q "printerCamera.transportText\|printerCameraStatusColor" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'deadline: .now() + 1.0' "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q 'Camera iPhone đang ẩn để tiết kiệm pin' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'filamentMaterialByExtruder' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'filamentColorHexByExtruder' "RedCameraTest/BambuPrinterControl.swift"
          grep -q 'Đèn máy in' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "minimumFramePublishInterval: TimeInterval = 0.20" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "downsampledCameraJPEG" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "PrinterCameraFrameView" "RedCameraTest/H2DTimelapseView.swift"
          test "$(grep -c 'captureScreenBrightnessControl' "RedCameraTest/H2DTimelapseView.swift")" -eq 2
          ! grep -q "flashAndDisplayCard" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "of: useEnglish ? vietnamese : english" "RedCameraTest/SELanguage.swift"
          grep -q "with: useEnglish ? english : vietnamese" "RedCameraTest/SELanguage.swift"
          grep -q "beginMqttLossGrace" "RedCameraTest/H2DBLEManager.swift"
          grep -q "stg_cur\|h2dStageCode" "RedCameraTest/H2DBLEManager.swift"
          grep -q "configurationTimeoutWorkItem" "RedCameraTest/H2DBLEManager.swift"
          grep -q "MQTT_AUTH_FAILED" "RedCameraTest/H2DBLEManager.swift"
          grep -q "SYNCING" "RedCameraTest/H2DBLEManager.swift"
          grep -q "H2DWiFiPasswordStore" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "AVAssetWriter" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isIdleTimerDisabled" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "recentFramePreviews" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "finishEarlyAndRender" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isLiveMonitorVisible" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q 'case "PRINTER"' "RedCameraTest/H2DBLEManager.swift"
