          grep -q "curatedFrameURLs" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "localizedEdgeIntrusion" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isFlashModeActive" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "brightnessBeforeFlashMode" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "enterFlashDisplayMode" "RedCameraTest/H2DTimelapseManager.swift"
          ! grep -q "isTorchSleepDisplayActive\|torchDisplaySleepDelay\|isPulsing" "RedCameraTest/H2DTimelapseManager.swift" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'bolt.fill' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "isStoppingPrint" "RedCameraTest/H2DBLEManager.swift"
          grep -q "isPausedPrint" "RedCameraTest/H2DBLEManager.swift"
          grep -q "h2dRemainingMinutes" "RedCameraTest/H2DBLEManager.swift"
