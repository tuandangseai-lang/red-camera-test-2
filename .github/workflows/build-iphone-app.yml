          grep -q "created.numberOfLoops = -1" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "AVCaptureVideoDataOutput" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "copyPixelBuffer" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "centerDarkRatio" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "lastAcceptedSignature" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "normalizedReferenceDifference" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "camera.videoZoomFactor = min" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "setTorchEnabled" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "VNTranslationalImageRegistrationRequest" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "curatedFrameURLs" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "localizedEdgeIntrusion" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isFlashModeActive" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "brightnessBeforeFlashMode" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "enterFlashDisplayMode" "RedCameraTest/H2DTimelapseManager.swift"
          ! grep -q "isTorchSleepDisplayActive\|torchDisplaySleepDelay\|isPulsing" "RedCameraTest/H2DTimelapseManager.swift" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'bolt.fill' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "isStoppingPrint" "RedCameraTest/H2DBLEManager.swift"
          grep -q "isPausedPrint" "RedCameraTest/H2DBLEManager.swift"
          grep -q "h2dRemainingMinutes" "RedCameraTest/H2DBLEManager.swift"
          grep -q 'case stopping' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case paused' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "prepareForPrinterProfile" "RedCameraTest/H2DBLEManager.swift"
          grep -q "isSwitchingPrinter" "RedCameraTest/H2DBLEManager.swift"
          grep -q 'case "TELEMETRY"' "RedCameraTest/H2DBLEManager.swift"
          grep -q "leftNozzleTemperature" "RedCameraTest/H2DBLEManager.swift"
          grep -q "exhaustFanPercent" "RedCameraTest/H2DBLEManager.swift"
          grep -q "switchToSelectedProfileIfPossible" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Đầu in" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Đầu phải" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Đầu trái" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "left is outside, right is inside" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Quạt chi tiết" "RedCameraTest/H2DTimelapseView.swift"
          grep -q '"Part fan"' "RedCameraTest/SELanguage.swift"
          ! grep -q "setupCameraEnabled" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "synchronizePrinterAlarm" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "camera sẵn sàng cho lần chụp kế tiếp" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "gain.globalGain = 9.54" "RedCameraTest/PrinterAlarmPlayer.swift"
          grep -q "criticalAlarmMinimumVolume: Float = 0.75" "RedCameraTest/PrinterAlarmPlayer.swift"
          grep -q "player.isPlaying && engine.isRunning" "RedCameraTest/PrinterAlarmPlayer.swift"
          ! grep -q "scheduleCameraSleep" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "restoreDisplayWhenLeaving" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "setViewActive" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "scheduleHardwareControls" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "if changed" "RedCameraTest/H2DBLEManager.swift"
          ! grep -q "đang đồng bộ loại nhựa\|đang đồng bộ nhựa" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'hasPrefix("22E")' "RedCameraTest/BambuPrinterProfile.swift"
          grep -q "hasActivePrinterAlert" "RedCameraTest/H2DBLEManager.swift"
          grep -q "hasActiveCriticalPrinterAlert" "RedCameraTest/H2DBLEManager.swift"
          grep -q "attemptAutomaticConfigurationIfNeeded" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "lanAccessCode.recovery" "RedCameraTest/BambuCredentialStore.swift"
          grep -q "ScreenEdgeLEDStrip" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case completed' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "requestFleetRefresh" "RedCameraTest/H2DBLEManager.swift"
          grep -q "setHardwareBuzzerEnabled" "RedCameraTest/H2DBLEManager.swift"
          ! grep -q "hardwareLevelPercent" "RedCameraTest/H2DBLEManager.swift" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "breathingPeriod" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "preservesProgressWhenHidden" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "ClockwiseScreenBorderShape" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "setCaptureScreenBrightness" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q 'SE.AppLanguage' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'frame(width: 180, height: 320)' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case "FAILED": return .stopping' "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'Hiện hình xem trước' "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "activePrinterCameraMonitor" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "OPTICAL VIEWFINDER" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "allowSetupPreview: false" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "silenceCurrentPrinterAlarm" "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'Tắt cảnh báo' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "desiredTimelapseArmed" "RedCameraTest/H2DBLEManager.swift"
          grep -q "printerSwitchProgress" "RedCameraTest/H2DBLEManager.swift"
          grep -q "printerProfileSwitchProgress" "RedCameraTest/H2DTimelapseView.swift"
          sips -g hasAlpha "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" | grep -q "hasAlpha: no"
          grep -q "cameraWarmupTimeout" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q 'video.slash.fill' "RedCameraTest/H2DTimelapseView.swift"
          grep -q "Hồ sơ.*đã lưu" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "H2DTimelapseView" "RedCameraTest/ContentView.swift"
          ! grep -q "CameraController.swift" project.yml
          ! grep -q "path: RedCameraTest/BLEManager.swift" project.yml
          ! grep -q "VoiceNotifier.swift" project.yml
          ! grep -q "VLCKit" project.yml
          grep -q "BambuPrinterCamera.swift" project.yml
          grep -q "BambuPrinterCameraManager" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "RTP/AVP/TCP;unicast;interleaved=0-1" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "CMVideoFormatDescriptionCreateFromH264ParameterSets" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "0x3000" "RedCameraTest/BambuPrinterCamera.swift"
          grep -q "printerCameraCard" "RedCameraTest/H2DTimelapseView.swift"
          grep -q "PrinterRemoteControlView(" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "printerRemoteControlCard\|showPrinterControls" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "skipSelectedPrintObjects" "RedCameraTest/H2DBLEManager.swift"
          grep -q "loadFilament" "RedCameraTest/H2DBLEManager.swift"
          grep -q 'compactActionLabel("Dừng", icon: "stop.fill")' "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "alarmNeedsAttention" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "Tắt cảnh báo" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "NHỰA CUỘN NGOÀI • ĐẦU TRÁI" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q "CAMERA MÁY IN\|CHẠM VẬT THỂ CẦN BỎ QUA" "RedCameraTest/PrinterRemoteControlView.swift"
          ! grep -q "objectIDsText\|filamentSource\|selectedObjectIDs" "RedCameraTest/PrinterRemoteControlView.swift"
          grep -q "BambuPrinterControl.swift" project.yml
          ! grep -q "ZIPFoundation" project.yml
          ! grep -q 'command: "skip_objects"' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"target": 254' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"ams_id": 254' "RedCameraTest/BambuPrinterControl.swift"
          grep -q '"extruder_id": 1' "RedCameraTest/BambuPrinterControl.swift"
          grep -q "blinks: false" "RedCameraTest/H2DTimelapseView.swift"
          ! grep -q "ESP32-C3" "RedCameraTest/H2DTimelapseView.swift"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$PLIST"
          ! grep -q "NSMicrophoneUsageDescription" "$PLIST"

      - name: Bien dich app iPhone chua ky
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project RedCameraTest.xcodeproj \
            -scheme RedCameraTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "## Loi bien dich Swift/Xcode" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(fatal )?error:|:[0-9]+:[0-9]+: error:' "$BUILD_LOG" \
              | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Dong goi IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RedCameraTest.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test -f "$APP_PATH/fire-alarm-sound.mp3"
          test -f "$APP_PATH/iphone-screenshot-shutter.mp3"
          test -f "$APP_PATH/cine-projector-loop.mp3"
          test -f "$APP_PATH/en.lproj/Localizable.strings"
          test -f "$APP_PATH/vi.lproj/Localizable.strings"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "SE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "9.78"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "157"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/SE-v9.78-build157-unsigned.ipa"

      - name: Tai IPA
        uses: actions/upload-artifact@v7
        with:
          name: SE-v9.78-build157-unsigned-ipa
          path: SE-v9.78-build157-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-h2d-esp32:
    name: Build ESP32 Bambu Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cai ESP32, MQTT, NimBLE va NeoPixel
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install PubSubClient
          arduino-cli lib install NimBLE-Arduino@2.5.1
          arduino-cli lib install "Adafruit NeoPixel"

      - name: Tranh double-free khi TLS mat ket noi
        run: |
          set -euo pipefail
          PUBSUB_CPP="$(find "$HOME" -path '*/PubSubClient/src/PubSubClient.cpp' -print -quit)"
          test -n "$PUBSUB_CPP"
          python3 - "$PUBSUB_CPP" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "            if (this->_state == MQTT_CONNECTED) {\n                this->_state = MQTT_CONNECTION_LOST;\n                _client->flush();\n                _client->stop();\n            }"
          new = "            if (this->_state == MQTT_CONNECTED) {\n                this->_state = MQTT_CONNECTION_LOST;\n#if !defined(ARDUINO_ARCH_ESP32)\n                _client->flush();\n                _client->stop();\n#endif\n            }"
          if old not in text:
              raise SystemExit("PubSubClient connected() block not found")
          path.write_text(text.replace(old, new, 1))
          PY
          NETWORK_SECURE_CPP="$(find "$HOME" -path '*/NetworkClientSecure/src/NetworkClientSecure.cpp' -print -quit)"
          test -n "$NETWORK_SECURE_CPP"
          python3 - "$NETWORK_SECURE_CPP" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          old = "uint8_t NetworkClientSecure::connected() {\n  if (_connected) {\n    uint8_t dummy = 0;\n    read(&dummy, 0);\n  }\n  return _connected;\n}"
          new = "uint8_t NetworkClientSecure::connected() {\n  // Avoid the ESP32 TLS read(0) probe; available()/read() owns disconnect cleanup.\n  return _connected;\n}"
          if old not in text:
              raise SystemExit("NetworkClientSecure connected() block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Bien dich firmware cau noi H2D
        run: |
          set -euo pipefail
          grep -q 'id == 0 ? nozzleTemperature : leftNozzleTemperature' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'hasCriticalPrinterError' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_PROFILE' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'maintainFleetMonitors' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_REFRESH_PERIOD_MS = 15000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_MONITOR_DWELL_MS = 3000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_SAMPLES_PER_REFRESH = 2' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_REFRESH_WATCHDOG_MS = 14000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FLEET_MQTT_BUFFER_BYTES = 24576' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_FLEET_REFRESH' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'BUZZER_PIN = 33' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'updateBuzzerAlarm' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'mc_remaining_time' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'isPausedState' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_STRIP_PIN = 5' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_STATUS_COUNT = 3' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_ANIMATED_COUNT = 4' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_PHYSICAL_COUNT = 10' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_IDLE_MAX_SCALE = 102' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'H2D_BUZZER' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'LED_DEFAULT_BRIGHTNESS_PERCENT = 95' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'fixedLedBrightness' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          ! grep -q 'LEVEL_POT\|potentiometerDetected\|CONTROL,LEVEL' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'modeEntryFlashUntil = now + 1000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'hardwareMode == 0' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'breathingScale(now)' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'completedPixels + 1' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
          grep -q 'FILAMENT_CHANGE_ERROR_GRACE_MS = 6000' iphone_red_camera_test/esp32_h2d_timelapse_ble/esp32_h2d_timelapse_ble.ino
