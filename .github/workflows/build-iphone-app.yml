name: Tao IPA SE v8.3 build77 - H2D timelapse theo layer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "iphone_red_camera_test/**"
      - ".github/workflows/build-iphone-app.yml"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Build SE iPhone App
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai XcodeGen
        run: brew install xcodegen

      - name: Tao project Xcode
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          test -f "RedCameraTest/VoiceNotifier.swift"
          xcodegen generate

      - name: Kiem tra kien truc MaixCAM
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -euo pipefail
          PLIST="RedCameraTest/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$PLIST"
          test -f "RedCameraTest/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          test -f "RedCameraTest/Assets.xcassets/WaterRocketTabIcon.imageset/WaterRocketTabIcon@3x.png"
          grep -q "builtInUltraWideCamera" "RedCameraTest/CameraController.swift"
          grep -q "lockedUltraWideZoomFactor" "RedCameraTest/CameraController.swift"
          if grep -q "ramp(toVideoZoomFactor" "RedCameraTest/CameraController.swift"; then
            echo "Camera iPhone phai giu 0,5x, khong duoc zoom/ramp"
            exit 1
          fi
          grep -q "bluetooth.arm" "RedCameraTest/ContentView.swift"
          grep -q "GimbalTrackingState" "RedCameraTest/BLEManager.swift"
          grep -q "enrollmentOverlay" "RedCameraTest/ContentView.swift"
          grep -q "ENROLL" "RedCameraTest/BLEManager.swift"
          grep -q "WaterRocketTabIcon" "RedCameraTest/ContentView.swift"
          grep -q "calibrateCenter" "RedCameraTest/BLEManager.swift"
          grep -q "calibrationOverlay" "RedCameraTest/ContentView.swift"
          grep -q "lockedTargetName" "RedCameraTest/BLEManager.swift"
          grep -q "SelectionCandidate" "RedCameraTest/BLEManager.swift"
          grep -q "candidateSelectionOverlay" "RedCameraTest/ContentView.swift"
          grep -q "SpatialTapGesture" "RedCameraTest/ContentView.swift"
          grep -q 'case "SELECTED"' "RedCameraTest/BLEManager.swift"
          grep -q 'case "CENTER"' "RedCameraTest/BLEManager.swift"
          grep -q "MaixCAM" "RedCameraTest/ContentView.swift"
          test -f "RedCameraTest/H2DTimelapseManager.swift"
          test -f "RedCameraTest/H2DTimelapseView.swift"
          grep -q 'case "SNAP"' "RedCameraTest/BLEManager.swift"
          grep -q "AVAssetWriter" "RedCameraTest/H2DTimelapseManager.swift"
          grep -q "isIdleTimerDisabled" "RedCameraTest/H2DTimelapseManager.swift"
          if grep -q "import Vision" "RedCameraTest/CameraController.swift"; then
            echo "iPhone khong duoc chay AI Vision trong kien truc MaixCAM"
            exit 1
          fi

      - name: Bien dich app iPhone chua ky
        working-directory: iphone_red_camera_test/ios/RedCameraTest
        run: |
          set -uo pipefail
          BUILD_LOG="$RUNNER_TEMP/xcodebuild.log"
          set +e
          xcodebuild \
            -project RedCameraTest.xcodeproj \
            -scheme RedCameraTest \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "## Loi bien dich Swift/Xcode" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^|[[:space:]])(fatal )?error:|:[0-9]+:[0-9]+: error:' "$BUILD_LOG" \
              | tail -80 | tee -a "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit "$BUILD_STATUS"
          fi

      - name: Dong goi IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/RedCameraTest.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP_PATH/Info.plist")" = "SE"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "8.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "77"
          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/SE-v8.3-build77-unsigned.ipa"

      - name: Tai IPA
        uses: actions/upload-artifact@v7
        with:
          name: SE-v8.3-build77-unsigned-ipa
          path: SE-v8.3-build77-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  build-h2d-esp32:
    name: Build ESP32 H2D Bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6

      - name: Cai Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Cai ESP32 va thu vien MQTT
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install PubSubClient

      - name: Bien dich firmware cau noi H2D
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/SE-H2D-ESP32"
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=huge_app \
            --output-dir "$RUNNER_TEMP/SE-H2D-ESP32" \
            iphone_red_camera_test/esp32_h2d_timelapse_ble

      - name: Tai firmware ESP32
        uses: actions/upload-artifact@v7
        with:
          name: SE-H2D-ESP32-v1.0.0
          path: ${{ runner.temp }}/SE-H2D-ESP32/*
          if-no-files-found: error
          retention-days: 7
